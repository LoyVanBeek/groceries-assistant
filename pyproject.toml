[project]
name = "groceries-assistant"
version = "2.0.0"
description = "Weekly dinner planner + AH shopping list builder"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "httpx[http2]>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "recipe-scrapers>=15.0",
    "qrcode>=8.2",
    "python-multipart>=0.0.32",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.6",
    "pytest-cov>=5.0",
    "ty>=0.0.84",
    "pre-commit>=4.6.2",
]

[build-system]
requires = ["uv_build>=0.8.0,<1.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "groceries_assistant"

[project.scripts]
groceries-assistant = "groceries_assistant.main:app"

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # en-dashes in Dutch text/regexes are intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
